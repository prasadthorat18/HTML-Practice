<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>regestration form</title>
    </head>
    <body>
        <h2>Registration form</h2>
        <h4>Welcome to my page</h4>

        <form action="/server.com">
            <div>
                <label for="user">Username:</label>
                <input type="text" name="user" id="user" placeholder="username">
                <br>
                <br>
                <label for="pass">Password:</label>
                <input type="password" name="pass" id="pass" placeholder="password">
            </div>
            <hr>
            <div>
                first name:<input type="text" placeholder="First Name" name="fname">
                last name:<input type="text" placeholder="Last Name" name="lname">
                <br>
                <br>
                <label for="gen">PLease Select Gender</label>
                <select name="gender" id="gen">
                    <option value="ml" selected >male</option>
                    <option value="fl">female</option>
                    <option value="ot">Other</option>
                </select>

                <label for="dob">Date of Birth</label>
                <input type="date" name="dob" id="dob" placeholder="Datet of birth">
            </div>
            <hr>

            <div>
                <label for="mobile">Mobile number:</label>
                <input type="number" name="mob" id="mobile" placeholder="mobile no.">

                <label for="mail">E-mail:</label>
                <input type="email" name="mail" id="mail" placeholder="E-mail">
            </div>
            <br>
            <div>
                <label for="cnt">country: </label>
                <select name="country" id="cnt">
                    <option value="null" selected>select an option</option>
                    <option value="ind">India</option>
                    <option value="pak">Pakistan</option>
                    <option value="eng">England</option>
                    <option value="aus">australia</option>
                </select>

                State:<input type="text" placeholder="State" name="state">
                City:<input type="text" placeholder="city" name="city">
                PinCode:<input type="number" placeholder="pincode" name="pcode">
                
            </div>
            <hr>

            
            <div>
                <label for="if">Write about yorself: </label>
                <textarea name="info" id="if" placeholder="write anything like skills and all"></textarea>
            </div>
            <br>
            <div>
                Do You Agree all trems of services? 
                <input type="checkbox" id="tff" name="terms" checked >
                <label for="tff">Yes, I agree.</label>
            </div>
            <hr>
            <button>Register</button>
        </form>
    </body> 
</html>
